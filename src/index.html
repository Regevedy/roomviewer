<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- RV-05: this is a local editor, not a general-purpose browser. Inline event
     attributes in the legacy UI still need unsafe-inline until refactored. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Room Viewer — 1.0 build 1101 OB</title>
<style>
/* Offline system font fallbacks; no third-party stylesheets in the desktop app. */

:root {
  /* Dark Theme (default) */
  --bg-primary: #08080c;
  --bg-secondary: #0e0e14;
  --bg-tertiary: #14141c;
  --bg-panel: #111118;
  --bg-hover: #1a1a24;
  --bg-active: #22222e;
  --border: #1e1e2a;
  --border-light: #2a2a38;
  --text-primary: #e8e8f0;
  --text-secondary: #8888a0;
  --text-dim: #555570;
  --accent: #6c5ce7;
  --accent-hover: #7d6ff0;
  --accent-glow: rgba(108, 92, 231, 0.3);
  --success: #00d2a0;
  --warning: #ffb347;
  --danger: #ff5c72;
  --info: #4da6ff;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --panel-blur: blur(20px);
  --scrollbar-thumb: #2a2a38;
  --gradient-accent: linear-gradient(135deg, #6c5ce7, #a855f7, #ec4899);
}

[data-theme="light"] {
  --bg-primary: #f0f0f5;
  --bg-secondary: #e8e8f0;
  --bg-tertiary: #ffffff;
  --bg-panel: rgba(255,255,255,0.95);
  --bg-hover: #e0e0ea;
  --bg-active: #d0d0dd;
  --border: #d0d0dd;
  --border-light: #c0c0d0;
  --text-primary: #1a1a2e;
  --text-secondary: #5a5a70;
  --text-dim: #8888a0;
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
  --scrollbar-thumb: #c0c0d0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  user-select: none;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* ═══ TITLE BAR ═══ */
.titlebar {
  display: flex;
  align-items: center;
  height: 38px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
  z-index: 1000;
  position: relative;
}
.titlebar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-weight: 700;
  font-size: 13px;
  background: var(--gradient-accent);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.titlebar-logo svg { width: 18px; height: 18px; }
.titlebar-menu {
  display: flex;
  gap: 2px;
  padding: 0 8px;
  -webkit-app-region: no-drag;
}
.titlebar-menu button {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.titlebar-menu button:hover { background: var(--bg-hover); color: var(--text-primary); }
.titlebar-controls {
  display: flex;
  margin-left: auto;
  -webkit-app-region: no-drag;
}
.titlebar-controls button {
  width: 46px;
  height: 38px;
  border: none;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.titlebar-controls button:hover { background: var(--bg-hover); color: var(--text-primary); }
.titlebar-controls .close-btn:hover { background: var(--danger); color: #fff; }

/* ═══ TOOLBAR ═══ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
}
.tool-group {
  display: flex;
  gap: 2px;
  padding: 0 6px;
  border-right: 1px solid var(--border);
}
.tool-group:last-child { border-right: none; }
.tool-btn {
  width: 34px;
  height: 34px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  position: relative;
}
.tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }
.tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tool-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
.tool-btn:disabled:hover { background: none; }
.tool-btn svg { width: 18px; height: 18px; }
.tool-btn[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  z-index: 999;
  margin-top: 4px;
}

.toolbar-spacer { flex: 1; }
.toolbar-info {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  padding: 0 8px;
}

/* ═══ MAIN LAYOUT ═══ */
.app-body {
  display: flex;
  height: calc(100vh - 38px - 46px - 32px);
}

/* ═══ LEFT PANEL ═══ */
.panel-left {
  width: 280px;
  min-width: 280px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
}
.panel-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.panel-tab:hover { color: var(--text-secondary); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  margin-bottom: 8px;
}
.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}

.catalog-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.catalog-item {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
}
.catalog-item:hover {
  border-color: var(--accent);
  background: var(--bg-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px var(--accent-glow);
}
/* RV-11: never present unavailable effects as working buttons. */
.catalog-item-disabled { opacity: .48; cursor: not-allowed; }
.catalog-item-disabled:hover { border-color: var(--border); background: var(--bg-tertiary); box-shadow: none; transform: none; }
.catalog-item .icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 8px;
  background: var(--bg-hover);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.catalog-item .name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
}
.catalog-item .category {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* Scene tree */
.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 12px;
  margin-bottom: 2px;
}
.tree-item:hover { background: var(--bg-hover); }
.tree-item.selected { background: var(--accent); color: #fff; }
.tree-item .tree-icon { font-size: 14px; }
.tree-item .tree-label { flex: 1; }
.tree-item .tree-vis {
  width: 16px;
  height: 16px;
  border: none;
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ═══ VIEWPORT ═══ */
.viewport-container {
  flex: 1;
  position: relative;
  background: var(--bg-primary);
}
#viewport {
  width: 100%;
  height: 100%;
  display: block;
}

.viewport-overlay-tl, .viewport-overlay-tr, .viewport-overlay-bl, .viewport-overlay-br {
  position: absolute;
  pointer-events: none;
  z-index: 10;
}
.viewport-overlay-tl { top: 12px; left: 12px; }
.viewport-overlay-tr { top: 12px; right: 12px; }
.viewport-overlay-bl { bottom: 12px; left: 12px; }
.viewport-overlay-br { bottom: 12px; right: 12px; }

.viewport-badge {
  background: var(--bg-panel);
  backdrop-filter: var(--panel-blur);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-secondary);
  pointer-events: auto;
}

.viewport-gizmo {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 80px;
  height: 80px;
  pointer-events: none;
  z-index: 10;
}

/* ═══ RIGHT PANEL ═══ */
.panel-right {
  width: 320px;
  min-width: 320px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.props-header {
  padding: 12px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.props-header .obj-icon {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.props-header .obj-name {
  font-size: 14px;
  font-weight: 600;
}
.props-header .obj-class {
  font-size: 11px;
  color: var(--text-dim);
}

.props-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.prop-section {
  margin-bottom: 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.prop-section-header {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  gap: 8px;
  transition: background 0.15s;
}
.prop-section-header:hover { background: var(--bg-hover); }
.prop-section-header svg { width: 14px; height: 14px; color: var(--text-dim); }
.prop-section-body { padding: 8px 12px 12px; }

.prop-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.prop-row:last-child { margin-bottom: 0; }
.prop-label {
  width: 60px;
  font-size: 11px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.prop-input {
  flex: 1;
  height: 28px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  padding: 0 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  transition: border-color 0.2s;
}
.prop-input:focus { outline: none; border-color: var(--accent); }

.xyz-row { display: flex; gap: 4px; flex: 1; }
.xyz-input {
  flex: 1;
  height: 28px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  padding: 0 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-align: center;
  transition: border-color 0.2s;
}
.xyz-input:focus { outline: none; border-color: var(--accent); }
.xyz-input.x:focus { border-color: #ff5c72; }
.xyz-input.y:focus { border-color: #00d2a0; }
.xyz-input.z:focus { border-color: #4da6ff; }

.color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.slider-val {
  min-width: 36px;
  text-align: right;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}
.toggle-label { font-size: 12px; }
.toggle-switch {
  width: 36px;
  height: 20px;
  background: var(--border);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch::after {
  content: '';
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 0.3s;
}
.toggle-switch.on::after { transform: translateX(16px); }

.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: var(--accent-hover); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-icon { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; }

/* ═══ BOTTOM BAR ═══ */
.bottom-bar {
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  gap: 16px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}
.bottom-bar .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.bottom-spacer { flex: 1; }

/* ═══ MODAL ═══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 600px;
  max-height: 80vh;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: modalIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-body { padding: 20px; overflow-y: auto; max-height: 60vh; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}

/* ═══ CONTEXT MENU ═══ */
.context-menu {
  position: fixed;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  min-width: 200px;
  box-shadow: var(--shadow);
  z-index: 3000;
  display: none;
}
.context-menu.show { display: block; }
.ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.1s;
  color: var(--text-primary);
}
.ctx-item:hover { background: var(--bg-hover); }
.ctx-item .shortcut { margin-left: auto; color: var(--text-dim); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.ctx-divider { height: 1px; background: var(--border); margin: 4px 8px; }

/* ═══ NOTIFICATION ═══ */
.notification-container {
  position: fixed;
  bottom: 44px;
  right: 16px;
  z-index: 4000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.notification {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideInRight 0.3s;
  min-width: 280px;
}
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.notification.success { border-left: 3px solid var(--success); }
.notification.info { border-left: 3px solid var(--info); }
.notification.warning { border-left: 3px solid var(--warning); }
.notification.error { border-left: 3px solid var(--danger); }

/* ═══ LOADING SPLASH ═══ */
.splash-screen {
  position: fixed;
  inset: 0;
  background: #08080c;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s;
}
.splash-screen.hidden { opacity: 0; pointer-events: none; }
.splash-logo {
  font-family: 'Outfit', sans-serif;
  font-size: 36px;
  font-weight: 800;
  background: var(--gradient-accent);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 24px;
}
.splash-bar {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.splash-bar-fill {
  height: 100%;
  background: var(--gradient-accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.3s;
}
.splash-text {
  margin-top: 16px;
  font-size: 12px;
  color: var(--text-dim);
}

/* RV-07: Persistent and keyboard-accessible startup failure; do not leave
   buttons in an apparently working editor without a WebGL2 engine. */
.engine-failure {
  position: fixed;
  inset: 38px 0 0;
  z-index: 9998;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background: rgba(8, 8, 14, .97);
  color: #f1f1fa;
}
.engine-failure-card {
  width: min(100%, 560px);
  padding: 30px;
  border: 1px solid #514b69;
  border-radius: 16px;
  background: #191723;
  box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
}
.engine-failure-card h2 { margin: 0 0 14px; font-size: 21px; }
.engine-failure-card p { margin: 10px 0; line-height: 1.55; font-size: 13px; }
.engine-failure-card .engine-failure-detail {
  padding: 10px 12px;
  border-radius: 8px;
  background: #30202a;
  color: #ffc1ce;
  overflow-wrap: anywhere;
}
.engine-failure-card .engine-failure-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.engine-failure-card button {
  padding: 11px 16px;
  border: 1px solid #756b8c;
  border-radius: 8px;
  background: #312b43;
  color: white;
  cursor: pointer;
}
.engine-failure-card button:first-child { background: #6052b5; border-color: #7566d0; }
.engine-failure-card button:focus-visible { outline: 3px solid #c0a3ff; outline-offset: 3px; }
/* Public build identity is deliberately visible in the titlebar. */
.release-build-tag {
  display: inline-block;
  margin-left: 9px;
  padding: 2px 7px;
  border: 1px solid var(--border-light);
  border-radius: 5px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 650;
  line-height: 14px;
  -webkit-text-fill-color: var(--text-secondary);

        if(!o.position.every(Number.isFinite))continue;
        candidates.push(o);
        if(invMass(o)===0 || o===editingObject)continue;
        previousPositions.set(o, [...o.position]);

              Math.max(a.b.c[k],a.b.c[k]+a.d[k])+a.b.h[k],

      const entries=candidates.filter(active).map(o=>({o,b:bounds(o)}));

      // or another rigid body can push the moving body back under the floor;
      // enforce floor support again after all collision corrections. When a
      // static ceiling leaves insufficient space, prioritize the level floor
      // over the ceiling (the two constraints cannot both be satisfied).
      // Do not apply floor friction twice within one microstep.
      for(const o of candidates) if(invMass(o)>0) {

        if(Number.isFinite(floor)) {
          const b=bounds(o), bottom=b.c[1]-b.h[1];

            o.position[1]+=floor-bottom;

          }

      }
      // Floor projection and contacts can also push coordinates beyond the
      // .rvproj v1 limits. Keep the saved project representable.
      for(const o of candidates) if(invMass(o)>0) {
        const v=o.physics.velocity;
        for(let k=0;k<3;k++) {
          if(o.position[k]>1e7) {o.position[k]=1e7;if(v[k]>0)v[k]=0;}
          else if(o.position[k]<-1e7) {o.position[k]=-1e7;if(v[k]<0)v[k]=0;}
          if(Math.abs(v[k])<0.001)v[k]=0;
        }
      }
    }
  }
  return {World, bounds, contact, defaults:DEFAULTS, params};
});

// UNDO / REDO SYSTEM

class UndoManager {
  // Ephemeral history identity persists across Undo/Redo reconstruction, but
  // never gets serialized to .rvproj. Numeric IDs alone are not ownership.
  static _historyTokens = new WeakMap();
  static tokenOf(obj) {
    if (!obj) return null;
    if (!UndoManager._historyTokens.has(obj)) UndoManager._historyTokens.set(obj, {});
    return UndoManager._historyTokens.get(obj);
  }
  static owns(action) {
    const obj = engine.objects.find(o => o.id === action.objId);
    return !!obj && !!action.token && UndoManager.tokenOf(obj) === action.token;
  }

  constructor(maxSteps = 80) {
    this.stack = [];      // past actions
    this.redoStack = [];  // undone actions

    this._batchActions = [];

      id: obj.id,
      position: [...obj.position],
      rotation: [...obj.rotation],
      scale: [...obj.scale],
      color: [...obj.color],
      metallic: obj.metallic,
      roughness: obj.roughness,
      opacity: obj.opacity,
      emissive: obj.emissive,
      category: obj.category,
      name: obj.name,
      type: obj.type,
      animType: obj.animType,
      hasTexture: obj.hasTexture,
      hasNormalMap: obj.hasNormalMap,
      hasMixMap: obj.hasMixMap,
      texturePreset: obj.texturePreset || 'generic',
      castShadow: obj.castShadow,
      receiveShadow: obj.receiveShadow,
      hidden: obj.hidden,
      locked: obj.locked,
      editable: obj.editable,
      selectable: obj.selectable,
      level: obj.level,
      tags: [...(obj.tags || [])],
      components: obj.components ? [...obj.components] : null,
      physics: { ...obj.physics, velocity: [...obj.physics.velocity], angularVelocity:[...(obj.physics.angularVelocity || [0,0,0])] },
    };
  }

  // Restore snapshot to object
  static restoreObj(obj, snap) {
    obj.position = [...snap.position];
    obj.rotation = [...snap.rotation];
    obj.scale = [...snap.scale];
    obj.color = [...snap.color];
    obj.metallic = snap.metallic;
    obj.roughness = snap.roughness;
    obj.opacity = snap.opacity;
    obj.emissive = snap.emissive;
    obj.category = snap.category;
    obj.name = snap.name;
    obj.animType = snap.animType;
    obj.hasTexture = snap.hasTexture;
    obj.hasNormalMap = snap.hasNormalMap;
    obj.hasMixMap = snap.hasMixMap;
    obj.texturePreset = snap.texturePreset || 'generic';
    obj.castShadow = snap.castShadow;
    obj.receiveShadow = snap.receiveShadow;
    obj.hidden = snap.hidden;
    obj.locked = snap.locked;
    Object.assign(obj.physics, snap.physics);
    obj.physics.velocity = [...(snap.physics.velocity || [0,0,0])];
    obj.physics.angularVelocity = [...(snap.physics.angularVelocity || [0,0,0])];

    obj.editable = snap.editable;
    obj.selectable = snap.selectable;
    obj.tags = [...(snap.tags || [])];
    obj.components = snap.components ? [...snap.components] : null;
    if (Number.isInteger(snap.level) && snap.level !== obj.level && engine.levels[snap.level]) {
      const old = engine.levels[obj.level];
      if (old) old.objects = old.objects.filter(id => id !== obj.id);
      if (!engine.levels[snap.level].objects.includes(obj.id)) {
        engine.levels[snap.level].objects.push(obj.id);
      }
      obj.level = snap.level;
    }
    // Type/geometry swap
    if (snap.type !== obj.type && engine && engine.geometries[snap.type]) {
      obj.type = snap.type;
      obj.geometry = engine.geometries[snap.type];

    }

  static canRestoreDeletedObject(snapshot, objId) {
    return !!snapshot && Number.isSafeInteger(objId) && objId > 0
      && Number.isInteger(snapshot.level) && !!engine.levels[snapshot.level]
      && !!engine.geometries[snapshot.type]
      && engine.objects.length < 10000
      && !engine.objects.some(o => o.id === objId);
  }

  static restoreDeletedObject(snapshot, objId, action) {
    // Avoid addObject's normal current-floor fallback when the original floor is missing.
    if (!UndoManager.canRestoreDeletedObject(snapshot, objId)) return null;

      id:objId, level:snapshot.level, physics:snapshot.physics });

    // and inside the floor's object index. Undoing deletion should not shuffle the scene.

      engine.objects.splice(Math.max(0, Math.min(action.index, engine.objects.length)), 0, restored);

    const levelIds = engine.levels[restored.level]?.objects;
    if (levelIds && Number.isInteger(action?.levelIndex)) {
      const position = levelIds.indexOf(restored.id);

  // Do not consume an Undo/Redo entry in either case.
  static restoreSingleAction(action) {

    const floorsBefore = engine.levels.map(floor => [...floor.objects]);
    const selectedBefore = engine.selectedObject;
    const levelBefore = engine.currentLevel;
    try {
      const restored = UndoManager.restoreDeletedObject(action.snapshot, action.objId, action);

        floor.objects.splice(0, floor.objects.length, ...floorsBefore[index]));

      if (engine.currentLevel !== levelBefore) setLevel(levelBefore);
      updateSceneTree(); updatePropertiesPanel(); updateObjectCount();
      console.warn('Object history restoration rolled back:', error);
      return false;
    }
  }

  // Undo of grouped geometry can throw *after* deleting some meshes.
  // Restore the exact object/room collections and all wall properties when
  // any stage fails, without consuming its history entry.
  static undoGroupAtomically(action, perform) {
    const originalObjects = [...engine.objects];
    const originalRooms = [...engine.rooms];
    const originalFloors = engine.levels.map(floor => [...floor.objects]);
    const previousSelection = engine.selectedObject;
    const cameraRef = engine.camera;
    const previousCamera = {...cameraRef, target:[...cameraRef.target]};
    const previousLevel = engine.currentLevel;
    const walls = action.type === 'connection' ? action.walls.map(entry => {
      const ref = engine.objects.find(obj => obj.id === entry.objId);
      return {ref, state:ref && UndoManager.snapshotObj(ref)};
    }) : [];
    const connections = action.type === 'connection' ? action.rooms.map(entry => {
      const ref = engine.rooms.find(room => room.id === entry.id);
      return {ref, ids:ref && [...ref.connections]};
    }) : [];
    try {
      if (perform() === false) throw new Error('Отмена операции отклонена');
      return true;
    } catch (error) {
      engine.objects.splice(0, engine.objects.length, ...originalObjects);
      engine.rooms.splice(0, engine.rooms.length, ...originalRooms);
      engine.levels.forEach((floor, index) =>
        floor.objects.splice(0, floor.objects.length, ...originalFloors[index]));
      for (const {ref,state} of walls) {
        if (ref && state) UndoManager.restoreObj(ref, state);
      }
      for (const {ref,ids} of connections) {
        if (ref && ids) ref.connections = [...ids];
      }
      // A failed action must not replace a camera reference observed by the renderer.
      engine.camera = cameraRef;
      Object.assign(cameraRef, previousCamera);
      engine.selectedObject = previousSelection;
      if (engine.currentLevel !== previousLevel) setLevel(previousLevel);
      updateSceneTree(); updatePropertiesPanel(); updateObjectCount();
      console.warn('Grouped undo rolled back:', error);
      return false;
    }
  }

  // Record an entire room as one undoable transaction (RV-10).
  recordRoom(room, firstObjectIndex, cameraBefore) {
    const objects = engine.objects.slice(firstObjectIndex).map(obj => ({
      objId: obj.id, snapshot: UndoManager.snapshotObj(obj),
      index: engine.objects.indexOf(obj),
      levelIndex: engine.levels[obj.level].objects.indexOf(obj.id),
      // Ephemeral ownership token: ID alone cannot identify a room member safely.
      ref: obj, token: UndoManager.tokenOf(obj)
    }));
    this.push({type:'room', roomRef:room, room: {
      id:room.id, name:room.name, width:room.width, height:room.height,
      depth:room.depth, offset:[...room.offset], connections:[...room.connections]
    }, roomIndex:engine.rooms.indexOf(room), objects,
      cameraBefore:{...cameraBefore, target:[...cameraBefore.target]},
      cameraAfter:{...engine.camera, target:[...engine.camera.target]}});
  }

  // Room history is transactional. Do not remove a foreign object that
  // happens to reuse one of the room's IDs, or replay a half-restored room.
  static canUndoRoom(action) {
    return !!action?.roomRef && engine.rooms.includes(action.roomRef)
      && action.objects.every(entry => {
        const obj = engine.objects.find(o => o.id === entry.objId);
        return !!obj && UndoManager.tokenOf(obj) === entry.token && obj.level === entry.snapshot.level
          && !!engine.levels[obj.level]?.objects.includes(obj.id);
      });
  }

  static canRedoRoom(action) {
    if (engine.rooms.some(r => r.id === action.room.id)) return false;
    const ids = action.objects.map(entry => entry.objId);
    if (new Set(ids).size !== ids.length) return false;
    return action.objects.every(entry => UndoManager.canRestoreDeletedObject(entry.snapshot, entry.objId));
  }

  // All constituent objects must still belong to this history action.
  // Otherwise an ID collision can remove a foreign wall/doorway.
  static canUndoConnection(action) {
    return action.rooms.every((entry,i) => {
        const r = engine.rooms.find(r => r.id === entry.id);
        return !!r && UndoManager.tokenOf(r) === entry.token &&
          JSON.stringify(r.connections) === JSON.stringify(action.afterConnections[i]);
      }) &&
      [...action.walls, ...action.added].every(e => {
        const obj = engine.objects.find(o => o.id === e.objId);
        return !!obj && UndoManager.tokenOf(obj) === e.token;
      });
  }
  static canRedoConnection(action) {
    return action.rooms.every((entry,i) => {
        const r = engine.rooms.find(r => r.id === entry.id);
        return !!r && UndoManager.tokenOf(r) === entry.token &&
          JSON.stringify(r.connections) === JSON.stringify(action.beforeConnections[i]);
      }) &&
      engine.objects.length + action.added.length <= 10000 &&
      action.walls.every(e => {
        const obj = engine.objects.find(o => o.id === e.objId);
        return !!obj && UndoManager.tokenOf(obj) === e.token;
      }) && action.added.every(e => UndoManager.canRestoreDeletedObject(e.snapshot,e.objId));
  }

  // ── Push an action: { type, ...data } ──
  push(action) {
    if (this._batchOpen) {
      this._batchActions.push(action);
      return;
    }
    this.stack.push(action);
    if (this.stack.length > this.maxSteps) this.stack.shift();
    this.redoStack = []; // new action clears redo
    this.updateUI();
  }

  // ── Batch: group multiple sub-actions as one undo step ──
  beginBatch() { this._batchOpen = true; this._batchActions = []; }
  commitBatch(label) {
    this._batchOpen = false;
    if (this._batchActions.length > 0) {
      this.stack.push({ type: 'batch', label, actions: this._batchActions });
      if (this.stack.length > this.maxSteps) this.stack.shift();
      this.redoStack = [];
    }
    this._batchActions = [];
    this.updateUI();
  }
  cancelBatch() { this._batchOpen = false; this._batchActions = []; }

  // ── Record helpers ──
  recordTransform(obj) {
    _flushPendingEditorAction();
    this.recordTransformEnd(); // Finish any previous gesture before a new one begins.
    if (!obj || !engine.objects.includes(obj)) return;
    this._pendingTransform = {objId: obj.id, token: UndoManager.tokenOf(obj), before: UndoManager.snapshotObj(obj)};
  }

  // Commit only a genuine change. Empty clicks must not clear Redo.
  recordTransformEnd() {
    const pending = this._pendingTransform;
    if (!pending) return;
    this._pendingTransform = null;
    const obj = engine.objects.find(o => o.id === pending.objId);
    if (!obj || UndoManager.tokenOf(obj) !== pending.token) return;
    const after = UndoManager.snapshotObj(obj);
    if (JSON.stringify(pending.before) !== JSON.stringify(after)) {
      this.push({type:'transform', objId:obj.id, token:pending.token, before:pending.before, after});
    }
  }

  // Escape restores the pre-drag state without touching committed history.
  cancelTransform() {
    const pending = this._pendingTransform;
    this._pendingTransform = null;
    if (!pending) return false;
    const obj = engine.objects.find(o => o.id === pending.objId);
    if (obj && UndoManager.tokenOf(obj) === pending.token) UndoManager.restoreObj(obj, pending.before);
    return !!obj && UndoManager.tokenOf(obj) === pending.token;
  }

  discardTransform() { this._pendingTransform = null; }

  recordProperty(obj, label) {
    _flushPendingEditorAction();
    // A property edit must not overtake an unfinished drag in the history.
    if (this._pendingTransform) engine?.finishActiveDrag?.();
    this.recordTransformEnd();
    // Quick one-shot: snapshot before, return a finalize callback
    const before = UndoManager.snapshotObj(obj);
    const token = UndoManager.tokenOf(obj);
    return () => {
      // Do not resurrect stale inspector edits after object replacement.
      if (!engine.objects.includes(obj) || UndoManager.tokenOf(obj) !== token) return;
      const after = UndoManager.snapshotObj(obj);
      if (JSON.stringify(before) !== JSON.stringify(after)) {
        this.push({ type: 'property', label, objId: obj.id, token, before, after });
      }
      this.updateUI();
    };
  }

  recordAdd(obj) {
    _flushPendingEditorAction();
    if (this._pendingTransform) engine?.finishActiveDrag?.();
    this.recordTransformEnd();
    this.push({ type: 'add', objId: obj.id, token: UndoManager.tokenOf(obj), snapshot: UndoManager.snapshotObj(obj),
      index: engine.objects.indexOf(obj), levelIndex: engine.levels[obj.level]?.objects.indexOf(obj.id) });
  }

  recordDelete(obj) {
    _flushPendingEditorAction();
    if (this._pendingTransform) engine?.finishActiveDrag?.();
    this.recordTransformEnd();
    this.push({
      type: 'delete',
      objId: obj.id, token: UndoManager.tokenOf(obj),
      index: engine.objects.indexOf(obj),
      levelIndex: engine.levels[obj.level]?.objects.indexOf(obj.id),
      snapshot: UndoManager.snapshotObj(obj),
      geometryType: obj.type,
      level: obj.level,
      components: obj.components ? [...obj.components] : null,
    });
  }

  // ── UNDO ──
  undo() {
    engine?.finishActiveDrag?.();
    _flushPendingEditorAction();
    this.recordTransformEnd();
    if (this.stack.length === 0) return false;
    const next = this.stack[this.stack.length - 1];
    // Never consume a delete action if its original object cannot be restored.
    if (next.type === 'delete' && !UndoManager.canRestoreDeletedObject(next.snapshot, next.objId)) return false;
    if (next.type === 'room' && !UndoManager.canUndoRoom(next)) return false;
    if (next.type === 'connection' && !UndoManager.canUndoConnection(next)) return false;
    if (['add','transform','property'].includes(next.type) && !UndoManager.owns(next)) return false;
    // Undo of a room/connection may fail after removing only some geometry.
    if (next.type === 'room' || next.type === 'connection') {
      if (!UndoManager.undoGroupAtomically(next, () => this._applyUndo(next))) return false;
      this.stack.pop(); this.redoStack.push(next); this.updateUI();
      return true;
    }
    // An allocation can fail after validation, including after insertion.
    // Apply the fragile restoration before moving the history entry.
    if (next.type === 'delete') {
      if (this._applyUndo(next) === false) return false;
      this.stack.pop(); this.redoStack.push(next); this.updateUI();
      return true;
    }
    const action = this.stack.pop();
    this._applyUndo(action);
    this.redoStack.push(action);
    this.updateUI();
    return true;
  }

  _applyUndo(action) {
    if (action.type === 'batch') {
      for (let i = action.actions.length - 1; i >= 0; i--) this._applyUndo(action.actions[i]);
      return;
    }
    if (action.type === 'connection') {
      for (const entry of [...action.added].reverse()) {
        const obj = engine.objects.find(o => o.id === entry.objId);
        if (obj) engine.removeObject(obj, true);
      }
      for (const entry of action.walls) {
        UndoManager.restoreObj(engine.objects.find(o => o.id === entry.objId), entry.before);
      }
      action.rooms.forEach((entry,i) => { const r=engine.rooms.find(r=>r.id===entry.id); r.connections=[...action.beforeConnections[i]]; });
      return;
    }
    if (action.type === 'room') {
      for (let i = action.objects.length - 1; i >= 0; i--) {
        const obj = engine.objects.find(o => o.id === action.objects[i].objId);
        if (obj) engine.removeObject(obj, true);
      }
      const ri = engine.rooms.findIndex(r => r.id === action.room.id);
      if (ri !== -1) engine.rooms.splice(ri, 1);
      // RV-10: preserve the renderer's camera reference across group Undo.
      Object.assign(engine.camera, {...action.cameraBefore, target:[...action.cameraBefore.target]});
      return;
    }
    const obj = engine.objects.find(o => o.id === action.objId);

    if (action.type === 'transform' || action.type === 'property') {
      if (obj) UndoManager.restoreObj(obj, action.before);
    } else if (action.type === 'add') {
      if (obj) engine.removeObject(obj, true);
    } else if (action.type === 'delete') {
      return UndoManager.restoreSingleAction(action);
    }
  }

  // ── REDO ──
  redo() {
    engine?.finishActiveDrag?.();
    _flushPendingEditorAction();
    this.recordTransformEnd();
    if (this.redoStack.length === 0) return false;
    const next = this.redoStack[this.redoStack.length - 1];
    if (next.type === 'add' && !UndoManager.canRestoreDeletedObject(next.snapshot, next.objId)) return false;
    if (next.type === 'room' && !UndoManager.canRedoRoom(next)) return false;
    if (next.type === 'connection' && !UndoManager.canRedoConnection(next)) return false;
    if (['delete','transform','property'].includes(next.type) && !UndoManager.owns(next)) return false;
    // Connection/room and single-object redo may fail on allocation.
    // Preserve Redo for a retry instead of reporting a fictitious success.
    if (next.type === 'connection' || next.type === 'room' || next.type === 'add') {
      // Recreating multiple objects is a transaction, not a best-effort loop.
      // Failed Redo must keep the history step and the previous scene intact.
      if (this._applyRedo(next) === false) return false;
      this.redoStack.pop(); this.stack.push(next); this.updateUI();
      return true;
    }
    const action = this.redoStack.pop();
    this._applyRedo(action);
    this.stack.push(action);
    this.updateUI();
    return true;
  }

  _applyRedo(action) {
    if (action.type === 'batch') {
      for (const a of action.actions) this._applyRedo(a);
      return;
    }
    if (action.type === 'connection') {
      const recovered = [];
      try {
        for (const entry of action.added) {
          const obj = UndoManager.restoreDeletedObject(entry.snapshot, entry.objId, entry);
          if (!obj) throw new Error('Невозможно восстановить элемент прохода');
          recovered.push(obj);
        }
        for (const entry of action.walls) {
          UndoManager.restoreObj(engine.objects.find(o => o.id === entry.objId), entry.after);
        }
        action.rooms.forEach((entry,i) => { const r=engine.rooms.find(r=>r.id===entry.id); r.connections=[...action.afterConnections[i]]; });
        return true;
      } catch (error) {
        // Roll back even if allocation threw after inserting the last object.
        for (const entry of action.added) {
          const obj = engine.objects.find(o => o.id===entry.objId);
          if (obj) {
            engine.objects.splice(engine.objects.indexOf(obj),1);
            const ids=engine.levels[obj.level]?.objects;
            if (ids) {const i=ids.indexOf(obj.id);if(i>=0)ids.splice(i,1);}
          }
        }
        for (const entry of action.walls) {
          const wall=engine.objects.find(o=>o.id===entry.objId);
          if (wall) UndoManager.restoreObj(wall,entry.before);
        }
        action.rooms.forEach((entry,i) => {
          const r=engine.rooms.find(r=>r.id===entry.id);
          if (r) r.connections=[...action.beforeConnections[i]];
        });
        updateSceneTree(); updatePropertiesPanel(); updateObjectCount();
        console.warn('Connection redo rolled back:',error);
        return false;
      }
    }
    if (action.type === 'room') {
      const oldRoomRef = action.roomRef;
      const oldRefs = action.objects.map(entry => entry.ref);
      const cameraRef = engine.camera;
      const previousCamera = {...cameraRef, target:[...cameraRef.target]};
      const previousObjects = [...engine.objects];
      const existing = new Set(previousObjects);
      const priorLevelObjects = engine.levels.map(level => [...level.objects]);
      let newRoom = null;
      try {
        const r = action.room;
        const previousRoomToken = UndoManager.tokenOf(oldRoomRef);
        newRoom = {...r, offset:[...r.offset], connections:[...r.connections]};
        UndoManager._historyTokens.set(newRoom, previousRoomToken);
        engine.rooms.splice(Math.max(0, Math.min(action.roomIndex, engine.rooms.length)), 0, newRoom);
        for (const entry of action.objects) {
          const restored = UndoManager.restoreDeletedObject(entry.snapshot, entry.objId, entry);
          if (!restored) throw new Error('Невозможно восстановить часть комнаты');
          entry.ref = restored;
        }
        Object.assign(cameraRef, {...action.cameraAfter, target:[...action.cameraAfter.target]});
        action.roomRef = newRoom;
        return true;
      } catch (error) {
        // addObject may throw *after* inserting a mesh, so only a list of
        // successfully returned objects is insufficient for rollback.
        engine.objects.splice(0, engine.objects.length, ...previousObjects);
        engine.levels.forEach((level, i) => {
          level.objects.splice(0, level.objects.length, ...priorLevelObjects[i]);
        });
        if (newRoom) {
          const index = engine.rooms.indexOf(newRoom);
          if (index >= 0) engine.rooms.splice(index, 1);
        }
        if (engine.selectedObject && !existing.has(engine.selectedObject)) engine.selectedObject = null;
        Object.assign(cameraRef, previousCamera);
        engine.camera = cameraRef;
        action.roomRef = oldRoomRef;
        action.objects.forEach((entry, i) => { entry.ref = oldRefs[i]; });
        updateSceneTree(); updatePropertiesPanel(); updateObjectCount();
        console.warn('Room redo rolled back:', error);
        return false;
      }
    }
    const obj = engine.objects.find(o => o.id === action.objId);

    if (action.type === 'transform' || action.type === 'property') {
      if (obj && action.after) UndoManager.restoreObj(obj, action.after);
    } else if (action.type === 'add') {
      return UndoManager.restoreSingleAction(action);
    } else if (action.type === 'delete') {
      if (obj) engine.removeObject(obj, true);

    }
  }

  // ── Update toolbar buttons and status bar ──
  updateUI() {
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const info = document.getElementById('undoInfo');
    if (undoBtn) undoBtn.disabled = this.stack.length === 0;
    if (redoBtn) redoBtn.disabled = this.redoStack.length === 0;
    if (info) info.textContent = `Отмена: ${this.stack.length} / ${this.redoStack.length}`;
  }

  get canUndo() { return this.stack.length > 0; }
  get canRedo() { return this.redoStack.length > 0; }
  clear() {
    this.stack = []; this.redoStack = [];
    this.discardTransform(); this.cancelBatch();
    this.updateUI();
  }
}

// Global undo manager instance
const undoMgr = new UndoManager(80);


// GPU-backed offline texture maps. These are genuine sampled RGBA textures (albedo,
// tangent-space normal and mix/roughness), generated locally without network calls.
 // The bundled styles are procedural, not downloaded photographic PBR assets.
const RV_MATERIALS = Object.freeze(['generic','brick','wood','stone','metal','fabric','glass','sand','grass']);
function rvTexturePixels(material, kind, size = 64) {
  const bytes = new Uint8Array(size * size * 4);
  const fract = n => n - Math.floor(n);
  const noise = (x,y) => fract(Math.sin(x*127.1+y*311.7+material.length*72.9)*43758.5453);
  const clamp = v => Math.max(0,Math.min(1,v));
  const height = (x,y) => {
    const u=x/size, v=y/size, grain=noise(Math.floor(x/2),Math.floor(y/2));
    if(material==='brick') {
      const r=Math.floor(v*8), bx=fract(u*4+(r%2)*0.5), by=fract(v*8);
      return bx<0.035||by<0.045?0.12:0.68+grain*0.15;
    }
    if(material==='wood') return 0.35+0.36*Math.sin((u*12 +0.12*Math.sin(v*19))*Math.PI*2)+grain*0.1;
    if(material==='metal') return 0.54+0.16*Math.sin(v*size*2.7)+grain*0.08;
    if(material==='fabric') return 0.38+0.33*(Math.sin(u*size*1.8)*Math.sin(v*size*1.8))+grain*0.08;
    if(material==='stone'||material==='sand') return 0.35+grain*0.5;
    if(material==='grass') return 0.25+grain*0.54+0.15*Math.sin(u*size*3+v*size);
    if(material==='glass') return 0.5;
    return 0.45+0.16*Math.sin(u*size/4)*Math.sin(v*size/4);
  };
  const colors={generic:[0.91,0.91,0.91],brick:[0.65,0.29,0.23],wood:[0.61,0.43,0.23],stone:[0.55,0.55,0.55],metal:[0.68,0.72,0.78],fabric:[0.61,0.48,0.59],glass:[0.87,0.94,1],sand:[0.83,0.72,0.51],grass:[0.33,0.66,0.26]};
  const base=colors[material]||colors.generic;
  for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
    const i=(y*size+x)*4;
    const h=height(x,y),variation=(h-0.5)*0.55;
    let rgba;
    if(kind==='normal') {
      const dx=height((x+1)%size,y)-height((x+size-1)%size,y);
      const dy=height(x,(y+1)%size)-height(x,(y+size-1)%size);
      const strength=material==='glass'?0:1.4;
      let nx=-dx*strength, ny=-dy*strength, nz=1;
      const len=Math.hypot(nx,ny,nz); nx/=len;ny/=len;nz/=len;
      rgba=[nx*0.5+0.5,ny*0.5+0.5,nz*0.5+0.5,1];
    } else if(kind==='mix') {
      // R=secondary material mask, G=roughness multiplier.
      rgba=[clamp(0.3+(h-0.5)*1.3),material==='metal'?0.37:material==='glass'?0.14:clamp(0.63+variation),0,1];
    } else {
      const shade=material==='brick'&&h<0.2?0.56:clamp(0.9+variation);
      rgba=[clamp(base[0]*shade),clamp(base[1]*shade),clamp(base[2]*shade),1];
    }
    for(let c=0;c<4;c++) bytes[i+c]=Math.round(clamp(rgba[c])*255);
  }
  return bytes;
}
